name: Benchmark

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Run perf profiling and publish hotspot charts
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSSL_VERSION: 3.5.7
  OPENSSL_SHA256: a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8
  LIBRESSL_VERSION: 4.3.2
  LIBRESSL_SHA256: edf01aee24c65d69e6a9efcb9d44bcda682ff9d4f3bbbd95e794e1dfa90847b5

jobs:
  openssl:
    name: OpenSSL 3.5.7 LTS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      RESULT_ARCHITECTURE: ${{ matrix.arch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential cmake ninja-build perl

      - name: Download and verify OpenSSL
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 \
            --output "openssl-${OPENSSL_VERSION}.tar.gz" \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          echo "${OPENSSL_SHA256}  openssl-${OPENSSL_VERSION}.tar.gz" | sha256sum --check --strict
          mkdir openssl-source
          tar --extract --gzip --file "openssl-${OPENSSL_VERSION}.tar.gz" \
            --strip-components=1 --directory openssl-source

      - name: Configure OpenSSL
        working-directory: ${{ runner.temp }}/openssl-source
        run: >-
          ./Configure
          --prefix="${RUNNER_TEMP}/openssl-install"
          --libdir=lib
          no-shared
          no-tests
          no-docs

      - name: Compile and install OpenSSL
        working-directory: ${{ runner.temp }}/openssl-source
        run: |
          make --jobs "$(nproc)"
          make install_sw

      - name: Configure benchmark
        run: >-
          cmake -S . -B build-openssl -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOFB_BACKEND=OPENSSL
          -DOFB_RESULT_ARCHITECTURE="${RESULT_ARCHITECTURE}"
          -DOPENSSL_ROOT_DIR="${RUNNER_TEMP}/openssl-install"
          -DOPENSSL_USE_STATIC_LIBS=TRUE

      - name: Build benchmark
        run: cmake --build build-openssl --parallel

      - name: Test benchmark
        run: ctest --test-dir build-openssl --output-on-failure

      - name: Run benchmark matrix
        run: |
          mkdir -p results
          ./build-openssl/ofb-openssl --samples 3 --sample-ms 100 > "results/openssl-${RESULT_ARCHITECTURE}.jsonl"
          ./build-openssl/ofb-openssl-tls --samples 3 --sample-ms 100 > "results/openssl-${RESULT_ARCHITECTURE}-tls.jsonl"

      - name: Validate result
        run: >-
          python3 -c 'import json, os, pathlib;
          architecture = os.environ["RESULT_ARCHITECTURE"];
          rows = [json.loads(line) for line in pathlib.Path(f"results/openssl-{architecture}.jsonl").read_text().splitlines()];
          assert len(rows) == 54;
          assert all(row["backend"] == "openssl" for row in rows);
          tls_rows = [json.loads(line) for line in pathlib.Path(f"results/openssl-{architecture}-tls.jsonl").read_text().splitlines()];
          assert len(tls_rows) == 27;
          assert all(row["backend"] == "openssl" for row in tls_rows);
          assert all(row["architecture"] == architecture for row in rows + tls_rows);
          expected = "OpenSSL " + os.environ["OPENSSL_VERSION"] + " ";
          assert all(row["version"].startswith(expected) for row in rows + tls_rows);
          print(f"validated {len(rows)} primitive and {len(tls_rows)} TLS OpenSSL samples")'

      - name: Publish OpenSSL job summary
        run: >-
          python3 scripts/summarize_results.py results
          --title "OpenSSL benchmark results (${{ matrix.arch }})"
          --output "${GITHUB_STEP_SUMMARY}"

      - name: Upload benchmark result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-openssl-${{ env.OPENSSL_VERSION }}-${{ matrix.arch }}-${{ github.sha }}
          path: results/*.jsonl
          if-no-files-found: error
          retention-days: 14

  libressl:
    name: LibreSSL 4.3.2 baseline and patched (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      RESULT_ARCHITECTURE: ${{ matrix.arch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build patch

      - name: Download and verify LibreSSL
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 \
            --output "libressl-${LIBRESSL_VERSION}.tar.gz" \
            "https://ftp.openbsd.org/pub/OpenBSD/LibreSSL/libressl-${LIBRESSL_VERSION}.tar.gz"
          echo "${LIBRESSL_SHA256}  libressl-${LIBRESSL_VERSION}.tar.gz" | sha256sum --check --strict
          mkdir libressl-baseline-source libressl-patched-source
          tar --extract --gzip --file "libressl-${LIBRESSL_VERSION}.tar.gz" \
            --strip-components=1 --directory libressl-baseline-source
          tar --extract --gzip --file "libressl-${LIBRESSL_VERSION}.tar.gz" \
            --strip-components=1 --directory libressl-patched-source

      - name: Configure baseline LibreSSL
        run: >-
          cmake
          -S "${RUNNER_TEMP}/libressl-baseline-source"
          -B "${RUNNER_TEMP}/libressl-baseline-build"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBRESSL_APPS=OFF
          -DLIBRESSL_TESTS=OFF
      - name: Compile baseline LibreSSL
        run: cmake --build "${RUNNER_TEMP}/libressl-baseline-build" --parallel

      - name: Configure baseline benchmark
        run: >-
          cmake -S . -B build-libressl -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOFB_BACKEND=LIBRESSL
          -DOFB_RESULT_ARCHITECTURE="${RESULT_ARCHITECTURE}"
          -DLibreSSL_DIR="${RUNNER_TEMP}/libressl-baseline-build"

      - name: Build baseline benchmark
        run: cmake --build build-libressl --parallel

      - name: Test baseline benchmark
        run: ctest --test-dir build-libressl --output-on-failure

      - name: Apply LibreSSL patch under test
        run: >-
          patch -N -t -p1
          -d "${RUNNER_TEMP}/libressl-patched-source"
          -i "${GITHUB_WORKSPACE}/patches/libressl/lazy-tls13-receive-buffer.patch"

      - name: Configure patched LibreSSL
        run: >-
          cmake
          -S "${RUNNER_TEMP}/libressl-patched-source"
          -B "${RUNNER_TEMP}/libressl-patched-build"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLIBRESSL_APPS=OFF
          -DLIBRESSL_TESTS=OFF

      - name: Compile patched LibreSSL
        run: cmake --build "${RUNNER_TEMP}/libressl-patched-build" --parallel

      - name: Configure patched benchmark
        run: >-
          cmake -S . -B build-libressl-patched -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOFB_BACKEND=LIBRESSL
          -DOFB_RESULT_BACKEND=libressl-patched
          -DOFB_RESULT_ARCHITECTURE="${RESULT_ARCHITECTURE}"
          -DLibreSSL_DIR="${RUNNER_TEMP}/libressl-patched-build"

      - name: Build patched benchmark
        run: cmake --build build-libressl-patched --parallel

      - name: Test patched benchmark
        run: ctest --test-dir build-libressl-patched --output-on-failure

      - name: Run benchmark matrix
        run: |
          mkdir -p results
          ./build-libressl/ofb-libressl --samples 3 --sample-ms 100 > "results/libressl-${RESULT_ARCHITECTURE}.jsonl"
          ./build-libressl/ofb-libressl-tls --samples 3 --sample-ms 100 > "results/libressl-${RESULT_ARCHITECTURE}-tls.jsonl"
          ./build-libressl-patched/ofb-libressl --samples 3 --sample-ms 100 > "results/libressl-patched-${RESULT_ARCHITECTURE}.jsonl"
          ./build-libressl-patched/ofb-libressl-tls --samples 3 --sample-ms 100 > "results/libressl-patched-${RESULT_ARCHITECTURE}-tls.jsonl"

      - name: Validate result
        run: >-
          python3 -c 'import json, os, pathlib;
          architecture = os.environ["RESULT_ARCHITECTURE"];
          rows = [json.loads(line) for line in pathlib.Path(f"results/libressl-{architecture}.jsonl").read_text().splitlines()];
          assert len(rows) == 54;
          assert all(row["backend"] == "libressl" for row in rows);
          tls_rows = [json.loads(line) for line in pathlib.Path(f"results/libressl-{architecture}-tls.jsonl").read_text().splitlines()];
          assert len(tls_rows) == 27;
          assert all(row["backend"] == "libressl" for row in tls_rows);
          patched = [json.loads(line) for line in pathlib.Path(f"results/libressl-patched-{architecture}.jsonl").read_text().splitlines()];
          patched_tls = [json.loads(line) for line in pathlib.Path(f"results/libressl-patched-{architecture}-tls.jsonl").read_text().splitlines()];
          assert len(patched) == 54 and len(patched_tls) == 27;
          assert all(row["backend"] == "libressl-patched" for row in patched + patched_tls);
          assert all(row["architecture"] == architecture for row in rows + tls_rows + patched + patched_tls);
          print(f"validated baseline and patched LibreSSL results")'

      - name: Publish LibreSSL job summary
        run: >-
          python3 scripts/summarize_results.py results
          --title "LibreSSL benchmark results (${{ matrix.arch }})"
          --output "${GITHUB_STEP_SUMMARY}"

      - name: Upload benchmark result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-libressl-${{ env.LIBRESSL_VERSION }}-${{ matrix.arch }}-${{ github.sha }}
          path: results/*.jsonl
          if-no-files-found: error
          retention-days: 14

  profile:
    name: AEAD perf profile (${{ matrix.arch }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build and profiling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build patch perl linux-tools-common
          sudo apt-get install --yes "linux-tools-$(uname -r)" || sudo apt-get install --yes linux-tools-generic
          if ! perf --version; then
            perf_path=$(find /usr/lib/linux-tools -type f -name perf | sort -V | tail -n 1)
            test -n "${perf_path}"
            sudo ln --symbolic --force "${perf_path}" /usr/local/bin/perf
          fi
          perf --version
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true

      - name: Download and verify source archives
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 \
            --output "openssl-${OPENSSL_VERSION}.tar.gz" \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          echo "${OPENSSL_SHA256}  openssl-${OPENSSL_VERSION}.tar.gz" | sha256sum --check --strict
          mkdir openssl-profile-source
          tar --extract --gzip --file "openssl-${OPENSSL_VERSION}.tar.gz" \
            --strip-components=1 --directory openssl-profile-source

          curl --fail --location --retry 3 \
            --output "libressl-${LIBRESSL_VERSION}.tar.gz" \
            "https://ftp.openbsd.org/pub/OpenBSD/LibreSSL/libressl-${LIBRESSL_VERSION}.tar.gz"
          echo "${LIBRESSL_SHA256}  libressl-${LIBRESSL_VERSION}.tar.gz" | sha256sum --check --strict
          mkdir libressl-profile-source
          tar --extract --gzip --file "libressl-${LIBRESSL_VERSION}.tar.gz" \
            --strip-components=1 --directory libressl-profile-source

      - name: Build instrumented OpenSSL
        working-directory: ${{ runner.temp }}/openssl-profile-source
        run: |
          CFLAGS="-O3 -g -fno-omit-frame-pointer" ./Configure \
            --prefix="${RUNNER_TEMP}/openssl-profile-install" \
            --libdir=lib \
            no-shared \
            no-tests \
            no-docs
          make --jobs "$(nproc)"
          make install_sw

      - name: Build instrumented LibreSSL
        run: |
          cmake \
            -S "${RUNNER_TEMP}/libressl-profile-source" \
            -B "${RUNNER_TEMP}/libressl-profile-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O3 -g -fno-omit-frame-pointer -DNDEBUG" \
            -DLIBRESSL_APPS=OFF \
            -DLIBRESSL_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/libressl-profile-build" --parallel

      - name: Build instrumented benchmark executables
        run: |
          cmake -S . -B profile-build-openssl -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O3 -g -fno-omit-frame-pointer -DNDEBUG" \
            -DOFB_BACKEND=OPENSSL \
            -DOFB_RESULT_ARCHITECTURE="${{ matrix.arch }}" \
            -DOPENSSL_ROOT_DIR="${RUNNER_TEMP}/openssl-profile-install" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build profile-build-openssl --parallel
          ctest --test-dir profile-build-openssl --output-on-failure

          cmake -S . -B profile-build-libressl -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O3 -g -fno-omit-frame-pointer -DNDEBUG" \
            -DOFB_BACKEND=LIBRESSL \
            -DOFB_RESULT_ARCHITECTURE="${{ matrix.arch }}" \
            -DLibreSSL_DIR="${RUNNER_TEMP}/libressl-profile-build"
          cmake --build profile-build-libressl --parallel
          ctest --test-dir profile-build-libressl --output-on-failure

      - name: Capture perf profiles
        run: |
          scripts/profile_aead.sh openssl "${{ matrix.arch }}" \
            ./profile-build-openssl/ofb-openssl profiles
          scripts/profile_aead.sh libressl "${{ matrix.arch }}" \
            ./profile-build-libressl/ofb-libressl profiles

      - name: Publish profile visualization
        run: |
          python3 scripts/summarize_profiles.py profiles \
            --title "AEAD perf profiles (${{ matrix.arch }})" \
            --output profile-summary.md
          {
            echo '## Runner CPU'
            echo
            echo '```text'
            lscpu | grep -E '^(Architecture|Model name|CPU\(s\)|Thread|Core|Socket|Flags|Features):'
            echo '```'
            echo
            cat profile-summary.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload perf profiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-aead-${{ matrix.arch }}-${{ github.sha }}
          path: |
            profiles/
            profile-summary.md
          if-no-files-found: error
          retention-days: 14

  summary:
    name: OpenSSL vs LibreSSL summary
    needs: [openssl, libressl]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-*-${{ github.sha }}
          path: comparison
          merge-multiple: true

      - name: Publish comparison summary
        run: >-
          python3 scripts/summarize_results.py comparison
          --title "OpenSSL vs LibreSSL benchmark comparison"
          --output "${GITHUB_STEP_SUMMARY}"
